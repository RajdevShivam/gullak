<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contraption Prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root { --bg:#0f1220; --panel:#1b2036; --ink:#e8ebff; --muted:#8a90b8; --accent:#ffcc4d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:12px; padding:16px; }
  h1 { margin:0; font-size:22px; letter-spacing:.5px; }
  .sub { color:var(--muted); margin:0; }
  .wrap { position:relative; width:min(960px,100%); }
  canvas { width:100% !important; height:auto !important; display:block; border-radius:14px;
           box-shadow:0 10px 40px #0008; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:min(960px,100%); }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:var(--panel);
           color:var(--ink); cursor:pointer; display:flex; gap:8px; align-items:center; }
  button:hover:not(:disabled) { filter:brightness(1.3); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .sw { width:14px; height:14px; border-radius:4px; display:inline-block; }
  .count { color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .sep { width:1px; background:#ffffff22; margin:0 4px; }
  #play { background:var(--accent); color:#1a1400; font-weight:700; }
  .toast { position:absolute; inset:0; display:none; align-items:center; justify-content:center; pointer-events:none; }
  .toast.show { display:flex; }
  .toast div { background:#000c; padding:18px 30px; border-radius:14px; font-size:26px; font-weight:800; text-align:center; }
  .toast small { display:block; font-size:14px; color:var(--muted); font-weight:400; margin-top:6px; }
  .help { color:var(--muted); font-size:13px; text-align:center; }
</style>
</head>
<body>
  <h1>Contraption · prototype</h1>
  <p class="sub">Get the ball into the glowing cup. Build, then hit Play.</p>

  <div class="bar" id="tray"></div>
  <div class="wrap" id="wrap">
    <canvas id="c"></canvas>
    <div class="toast" id="toast"><div id="toastText"></div></div>
  </div>
  <div class="bar">
    <button id="play">▶ Play</button>
    <button id="reset">⟲ Reset</button>
    <button id="clear">✕ Clear parts</button>
  </div>
  <p class="help">Drag parts to move · scroll wheel or <b>R</b> to rotate · right-click or <b>Del</b> to remove · <b>Space</b> = play/reset</p>

<script>
const { Engine, Render, Bodies, Body, Composite, Events, Query, Vector } = Matter;
const W = 960, H = 600;
const FLOOR_Y = 520, PIT = { x0: 830, x1: 910 };
const FAN_LEN = 280, FAN_W = 70, FAN_FORCE = 0.0018;
const STONE = '#2a3152';

const PARTS = {
  ramp:    { label: 'Ramp',    color: '#6c8cff', max: 2,
             make: (x, y) => Bodies.rectangle(x, y, 180, 14, { isStatic: true, friction: 0.02, render: { fillStyle: '#6c8cff' } }) },
  bouncer: { label: 'Bouncer', color: '#ff5fa2', max: 1,
             make: (x, y) => Bodies.rectangle(x, y, 100, 16, { isStatic: true, restitution: 1.25, render: { fillStyle: '#ff5fa2' } }) },
  fan:     { label: 'Fan',     color: '#44d4c4', max: 1,
             make: (x, y) => Bodies.rectangle(x, y, 44, 44, { isStatic: true, chamfer: { radius: 10 }, render: { fillStyle: '#44d4c4' } }) },
  crate:   { label: 'Crate',   color: '#c8894a', max: 2, dynamic: true,
             make: (x, y) => Bodies.rectangle(x, y, 50, 50, { density: 0.002, friction: 0.6, render: { fillStyle: '#c8894a', strokeStyle: '#7a4f25', lineWidth: 3 } }) },
};

const LEVEL = {
  ball: { x: 110, y: 70 },
  statics: [
    [415, 560, 830, 80],   // floor left of cup
    [935, 560, 50, 80],    // floor right of cup
    [870, 595, 80, 10],    // cup bottom
    [-10, 300, 40, 600],   // left wall
    [970, 300, 40, 600],   // right wall
    [470, 420, 28, 200],   // the wall in the middle
  ],
};

// ---------- setup ----------
const canvas = document.getElementById('c');
const engine = Engine.create();
const render = Render.create({ canvas, engine, options: {
  width: W, height: H, wireframes: false, background: '#12162a', pixelRatio: window.devicePixelRatio || 1 } });

for (const [x, y, w, h] of LEVEL.statics)
  Composite.add(engine.world, Bodies.rectangle(x, y, w, h, { isStatic: true, friction: 0.05, render: { fillStyle: STONE } }));

const ball = Bodies.circle(LEVEL.ball.x, LEVEL.ball.y, 14, {
  restitution: 0.3, friction: 0.01, frictionAir: 0.001, density: 0.004, render: { fillStyle: '#ffcc4d' } });
Body.setStatic(ball, true);
Composite.add(engine.world, ball);

const placed = [];   // { type, body, home }
let mode = 'build';  // build | play | done
let selected = null, drag = null, t0 = 0, inCup = 0, still = 0, shake = 0;
let trail = [], confetti = [];

// ---------- tray ----------
const tray = document.getElementById('tray');
for (const [type, d] of Object.entries(PARTS)) {
  const b = document.createElement('button');
  b.dataset.part = type;
  b.innerHTML = `<span class="sw" style="background:${d.color}"></span>${d.label} <span class="count"></span>`;
  b.onclick = () => addPart(type);
  tray.appendChild(b);
}
const count = type => placed.filter(p => p.type === type).length;
function refreshUI() {
  for (const b of tray.children) {
    const d = PARTS[b.dataset.part], left = d.max - count(b.dataset.part);
    b.querySelector('.count').textContent = `×${left}`;
    b.disabled = mode !== 'build' || left <= 0;
  }
  document.getElementById('play').disabled = mode !== 'build';
  document.getElementById('clear').disabled = mode !== 'build';
}

function addPart(type, x = 300, y = 220) {
  const d = PARTS[type];
  const body = d.make(x, y);
  if (d.dynamic) Body.setStatic(body, true);   // frozen while building
  Composite.add(engine.world, body);
  selected = { type, body };
  placed.push(selected);
  tone(520, 0.06, 'triangle', 0.12);
  refreshUI();
}
function removePart(p) {
  Composite.remove(engine.world, p.body);
  placed.splice(placed.indexOf(p), 1);
  if (selected === p) selected = null;
  tone(260, 0.06, 'triangle', 0.1);
  refreshUI();
}

// ---------- input ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function toWorld(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function partAt(p) {
  const hits = Query.point(placed.map(q => q.body), p);
  return placed.find(q => q.body === hits[hits.length - 1]);
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  if (mode !== 'build') return;
  const p = toWorld(e), hit = partAt(p);
  if (e.button === 2) { if (hit) removePart(hit); return; }
  selected = hit || null;
  if (hit) { drag = { dx: hit.body.position.x - p.x, dy: hit.body.position.y - p.y }; canvas.setPointerCapture(e.pointerId); }
});
canvas.addEventListener('pointermove', e => {
  const p = toWorld(e);
  canvas.style.cursor = mode === 'build' && (drag || partAt(p)) ? 'grab' : 'default';
  if (drag && selected) Body.setPosition(selected.body, { x: clamp(p.x + drag.dx, 20, W - 20), y: clamp(p.y + drag.dy, 20, H - 20) });
});
canvas.addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => {
  if (mode !== 'build') return;
  const hit = partAt(toWorld(e)) || selected;
  if (!hit) return;
  e.preventDefault();
  selected = hit;
  Body.setAngle(hit.body, hit.body.angle + Math.sign(e.deltaY) * Math.PI / 24);
}, { passive: false });
addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); mode === 'build' ? play() : reset(); return; }
  if (mode !== 'build' || !selected) return;
  if (e.key === 'r' || e.key === 'R') Body.setAngle(selected.body, selected.body.angle + Math.PI / 12);
  if (e.key === 'Delete' || e.key === 'Backspace') removePart(selected);
});
document.getElementById('play').onclick = play;
document.getElementById('reset').onclick = reset;
document.getElementById('clear').onclick = () => { reset(); [...placed].forEach(removePart); };

// ---------- modes ----------
function play() {
  if (mode !== 'build') return;
  mode = 'play';
  for (const p of placed) {
    p.home = { x: p.body.position.x, y: p.body.position.y, a: p.body.angle };
    if (PARTS[p.type].dynamic) Body.setStatic(p.body, false);
  }
  Body.setStatic(ball, false);
  t0 = performance.now(); inCup = 0; still = 0; trail = []; selected = null;
  tone(330, 0.12, 'square', 0.06);
  refreshUI();
}
function reset() {
  mode = 'build';
  for (const p of placed) {
    if (PARTS[p.type].dynamic) Body.setStatic(p.body, true);
    if (p.home) { Body.setPosition(p.body, { x: p.home.x, y: p.home.y }); Body.setAngle(p.body, p.home.a); }
    Body.setVelocity(p.body, { x: 0, y: 0 }); Body.setAngularVelocity(p.body, 0);
  }
  Body.setStatic(ball, true);
  Body.setPosition(ball, LEVEL.ball); Body.setAngle(ball, 0);
  Body.setVelocity(ball, { x: 0, y: 0 });
  trail = [];
  showToast(null);
  refreshUI();
}
function win(t) {
  mode = 'done';
  const n = placed.length;
  const stars = 1 + (n <= 3) + (t < 6);
  showToast(`${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}<small>In the cup! ${n} part${n === 1 ? '' : 's'} · ${t.toFixed(1)}s — Space to retry</small>`);
  for (let i = 0; i < 160; i++) confetti.push({
    x: (PIT.x0 + PIT.x1) / 2, y: FLOOR_Y, vx: (Math.random() - 0.5) * 12, vy: -Math.random() * 14 - 4,
    c: `hsl(${Math.random() * 360},90%,65%)`, life: 120 });
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.15), i * 100));
  refreshUI();
}
function fail() {
  mode = 'done';
  showToast(`Not quite…<small>Space to reset and tweak your contraption</small>`);
  tone(200, 0.4, 'sawtooth', 0.06, 70);
  refreshUI();
}
function showToast(html) {
  const t = document.getElementById('toast');
  t.classList.toggle('show', !!html);
  if (html) document.getElementById('toastText').innerHTML = html;
}

// ---------- physics hooks ----------
Events.on(engine, 'beforeUpdate', () => {
  if (mode !== 'play') return;
  const movers = [ball, ...placed.filter(p => PARTS[p.type].dynamic).map(p => p.body)];
  for (const f of placed.filter(p => p.type === 'fan')) {
    const a = f.body.angle, dir = { x: Math.cos(a), y: Math.sin(a) }, nrm = { x: -dir.y, y: dir.x };
    for (const b of movers) {
      const rel = Vector.sub(b.position, f.body.position);
      const along = Vector.dot(rel, dir), side = Vector.dot(rel, nrm);
      if (along > 20 && along < FAN_LEN && Math.abs(side) < FAN_W / 2)
        Body.applyForce(b, b.position, Vector.mult(dir, FAN_FORCE * b.mass * (1 - 0.6 * along / FAN_LEN)));
    }
  }
});
Events.on(engine, 'afterUpdate', () => {
  if (mode !== 'play') return;
  trail.push({ x: ball.position.x, y: ball.position.y });
  if (trail.length > 45) trail.shift();
  const t = (performance.now() - t0) / 1000;
  const { x, y } = ball.position;
  inCup = x > PIT.x0 && x < PIT.x1 && y > FLOOR_Y ? inCup + 1 : 0;
  if (inCup > 20) return win(t);
  still = Vector.magnitude(ball.velocity) < 0.15 ? still + 1 : 0;
  if (still > 90 || t > 12 || y > H + 60) fail();
});
Events.on(engine, 'collisionStart', ev => {
  for (const pr of ev.pairs) {
    const other = pr.bodyA === ball ? pr.bodyB : pr.bodyB === ball ? pr.bodyA : null;
    if (!other) continue;
    if (placed.some(p => p.body === other && p.type === 'bouncer')) { tone(180, 0.25, 'sine', 0.25, 720); shake = 10; }
    else { const v = Vector.magnitude(ball.velocity); if (v > 2) tone(180 + v * 25, 0.04, 'sine', Math.min(0.12, v * 0.015)); }
  }
});

// ---------- drawing ----------
Events.on(render, 'afterRender', () => {
  const ctx = render.context, now = performance.now();
  ctx.save();
  // cup glow + label
  const g = ctx.createLinearGradient(0, FLOOR_Y - 40, 0, 590);
  g.addColorStop(0, '#ffcc4d00'); g.addColorStop(1, '#ffcc4d66');
  ctx.fillStyle = g; ctx.fillRect(PIT.x0, FLOOR_Y - 40, PIT.x1 - PIT.x0, 630 - FLOOR_Y - 40);
  ctx.fillStyle = '#ffcc4d'; ctx.font = 'bold 14px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('▼ CUP ▼', (PIT.x0 + PIT.x1) / 2, FLOOR_Y - 50 + Math.sin(now / 300) * 4);
  // drop hint
  if (mode === 'build') {
    ctx.setLineDash([4, 6]); ctx.strokeStyle = '#ffcc4d55'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ball.position.x, ball.position.y + 18); ctx.lineTo(ball.position.x, FLOOR_Y); ctx.stroke();
    ctx.setLineDash([]);
  }
  // fan airflow
  for (const f of placed.filter(p => p.type === 'fan')) {
    ctx.save(); ctx.translate(f.body.position.x, f.body.position.y); ctx.rotate(f.body.angle);
    ctx.fillStyle = '#44d4c412'; ctx.fillRect(22, -FAN_W / 2, FAN_LEN - 22, FAN_W);
    ctx.strokeStyle = '#44d4c455'; ctx.lineWidth = 2;
    const off = (now / 6) % 40;
    for (let s = 22 + off; s < FAN_LEN; s += 40) for (const yy of [-18, 0, 18]) {
      ctx.beginPath(); ctx.moveTo(s, yy); ctx.lineTo(s + 14, yy); ctx.stroke();
    }
    ctx.restore();
  }
  // trail
  trail.forEach((p, i) => {
    ctx.fillStyle = `rgba(255,204,77,${(i / trail.length) * 0.35})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, 14 * i / trail.length, 0, Math.PI * 2); ctx.fill();
  });
  // selection outline
  if (selected && mode === 'build') {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); selected.body.vertices.forEach((v, i) => i ? ctx.lineTo(v.x, v.y) : ctx.moveTo(v.x, v.y));
    ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  }
  // confetti
  confetti = confetti.filter(c => c.life-- > 0);
  for (const c of confetti) {
    c.vy += 0.35; c.x += c.vx; c.y += c.vy; c.vx *= 0.99;
    ctx.fillStyle = c.c; ctx.fillRect(c.x, c.y, 6, 10);
  }
  ctx.restore();
});

// ---------- sound ----------
let ac;
function tone(freq, dur, type, vol, slideTo) {
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch {}
}

// ---------- loop ----------
const wrap = document.getElementById('wrap');
(function loop() {
  if (mode === 'play') Engine.update(engine, 1000 / 60);
  shake *= 0.85;
  wrap.style.transform = shake > 0.5 ? `translate(${(Math.random() - 0.5) * shake}px,${(Math.random() - 0.5) * shake}px)` : '';
  requestAnimationFrame(loop);
})();
Render.run(render);
refreshUI();
window.__game = { addPart, play, reset, placed, ball, get mode() { return mode; } };   // for tests / demo
</script>
</body>
</html>
